[package]
name = "herdr-telegram"
version = "0.1.0"
edition = "2024"
description = "Drive Herdr coding agents (opencode, shells, any agent) from Telegram — prompts, answer cards, and stall alerts via DMs or forum topics"
license = "MIT"
repository = "https://github.com/ademgcl/herdr-telegram"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
